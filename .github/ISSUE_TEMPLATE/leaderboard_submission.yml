name: Leaderboard submission
description: Submit a model's results for the NL2GraphQL Bench leaderboard
title: "[Submission] "
labels: ["submission"]
body:
  - type: input
    id: model-name
    attributes:
      label: Model name
      placeholder: e.g. Llama-3.1-8B-Instruct
    validations:
      required: true

  - type: dropdown
    id: weight-class
    attributes:
      label: Open- or closed-weight?
      options:
        - Open-weight
        - Closed-weight (API)
    validations:
      required: true

  - type: input
    id: params
    attributes:
      label: Parameter count
      description: Use "undisclosed" if not public.
      placeholder: e.g. 8B
    validations:
      required: true

  - type: textarea
    id: method
    attributes:
      label: Method
      description: Base model, fine-tuning approach (if any), prompting setup, decoding config.
      placeholder: e.g. LoRA fine-tuned, r=16, alpha=32, lr=1e-4, 3 epochs, 2-shot at inference
    validations:
      required: true

  - type: textarea
    id: scores
    attributes:
      label: Public benchmark scores (%)
      description: Overall plus all seven categories.
      value: |
        Overall:
        Aliases:
        Directives:
        External Fragments:
        Inline Fragments:
        Filters:
        Pagination:
        Mutations:
    validations:
      required: true

  - type: input
    id: predictions-link
    attributes:
      label: Predictions file
      description: Link to your predictions.json (gist, repo, cloud storage — anywhere reachable).
    validations:
      required: true

  - type: input
    id: reproducibility-link
    attributes:
      label: Code / weights / paper link
      description: For closed models, include the API name and the exact version pinned at eval time.
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact email
      description: We'll reach out here once hidden-set verification is done.
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: My predictions and any linked code do not contain real production schemas, credentials, or internal API packages.
          required: true
        - label: I scored my model using an execution-grounded / semantic-equivalence method, not exact string matching.
          required: true
